let currentChapter = 1;
let currentTab = 'vocab';
let selectedVocabEng = null;
let selectedVocabKor = null;

// App Initialization & State Persistence
window.onload = function() {
  const savedChapter = localStorage.getItem('app_chapter');
  const savedTab = localStorage.getItem('app_tab');
  
  if (savedChapter) {
    currentChapter = parseInt(savedChapter);
    document.getElementById('chapterSelect').value = currentChapter;
  }
  if (savedTab) {
    currentTab = savedTab;
    updateTabUI();
  }
  renderContent();
};

function loadChapter(ch) {
  currentChapter = parseInt(ch);
  localStorage.setItem('app_chapter', currentChapter);
  renderContent();
}

function switchTab(tab) {
  currentTab = tab;
  localStorage.setItem('app_tab', currentTab);
  updateTabUI();
  renderContent();
}

function updateTabUI() {
  document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
    const tabs = ['vocab', 'expressions', 'pattern', 'unscramble'];
    if (tabs[idx] === currentTab) btn.classList.add('active');
    else btn.classList.remove('active');
  });
}

// Reset All Learning Records
function resetAllProgress() {
  if (confirm("모든 학습 기록 및 퀴즈 풀이 내역을 초기화하시겠습니까?")) {
    localStorage.clear();
    location.reload();
  }
}

// Text To Speech (TTS) Reader
function speakText(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  } else {
    alert("이 브라우저는 음성 재생(TTS)을 지원하지 않습니다.");
  }
}

// Helper: Seeded Random Shuffle
function shuffleArray(array, seedStr) {
  let arr = [...array];
  let hash = 0;
  for (let i = 0; i < seedStr.length; i++) {
    hash = seedStr.charCodeAt(i) + ((hash << 5) - hash);
  }
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.abs(hash + i) % (i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Render Tab Contents

  const data = courseData[currentChapter];

              </div>

              <!-- Chunk Pool -->
              ${!isDone ? `
                <div class="chunk-pool" id="pool_${uIdx}">
                  ${shuffledChunks.map((chunk, cIdx) => `
                    <div class="chunk-btn" id="chunk_${uIdx}_${cIdx}" onclick="selectChunk(${uIdx}, '${chunk.replace(/'/g, "\\'")}', ${cIdx})">
                      ${chunk}

                </div>
              `}

          `;
        }).join('')}

}

// Unscramble Interactive Logic
let currentUnscrambleState = {};

function selectChunk(uIdx, chunkText, cIdx) {
  const itemKey = `u_${currentChapter}_${uIdx}`;
  if (!currentUnscrambleState[itemKey]) {
    currentUnscrambleState[itemKey] = [];
  }
  
  const state = currentUnscrambleState[itemKey];
  const chunkBtn = document.getElementById(`chunk_${uIdx}_${cIdx}`);
  
  if (chunkBtn.classList.contains('used')) return;

  state.push({ text: chunkText, cIdx: cIdx });
  chunkBtn.classList.add('used');

  renderDropzone(uIdx);
}

function removeChunk(uIdx, arrayIdx) {
  const itemKey = `u_${currentChapter}_${uIdx}`;
  const state = currentUnscrambleState[itemKey];
  if (!state) return;

  const removed = state.splice(arrayIdx, 1)[0];
  const chunkBtn = document.getElementById(`chunk_${uIdx}_${removed.cIdx}`);
  if (chunkBtn) chunkBtn.classList.remove('used');

  renderDropzone(uIdx);
}

function renderDropzone(uIdx) {
  const itemKey = `u_${currentChapter}_${uIdx}`;
  const state = currentUnscrambleState[itemKey] || [];
  const dropzone = document.getElementById(`dropzone_${uIdx}`);
  const un = courseData[currentChapter].unscramble[uIdx];

  dropzone.innerHTML = state.map((item, idx) => `
    <div class="chunk-btn" style="background:#eff6ff; border-color:#2563eb; color:#2563eb;" onclick="removeChunk(${uIdx}, ${idx})">
      ${item.text} ✕
    </div>
  `).join('');

  // Check Full Combination
  if (state.length === un.chunks.length) {
    const userString = state.map(s => s.text).join(' ');
    const targetString = un.chunks.join(' ');

    if (userString === targetString) {
      // Success
      dropzone.classList.add('success');
      localStorage.setItem(`unscramble_${currentChapter}_${uIdx}`, 'true');
      setTimeout(() => {
        renderContent();
      }, 400);
    } else {
      // Incorrect -> Flash Red & Reset State
      dropzone.classList.add('error');
      setTimeout(() => {
        dropzone.classList.remove('error');
        currentUnscrambleState[itemKey] = [];
        renderContent();
      }, 800);
    }
  }
}

// Matching Logic
function selectEng(eng) {
  selectedVocabEng = eng;
  document.querySelectorAll('[id^="eng_"]').forEach(el => el.classList.remove('selected'));
  document.getElementById(`eng_${eng.replace(/\s+/g, '_')}`).classList.add('selected');
  checkMatch();
}

function selectKor(kor) {
  selectedVocabKor = kor;
  document.querySelectorAll('[id^="kor_"]').forEach(el => el.classList.remove('selected'));
  document.getElementById(`kor_${kor.replace(/\s+/g, '_')}`).classList.add('selected');
  checkMatch();
}

function checkMatch() {
  if (selectedVocabEng && selectedVocabKor) {
    const list = courseData[currentChapter].vocab;
    const match = list.find(v => v.eng === selectedVocabEng && v.kor === selectedVocabKor);
    
    if (match) {
      document.getElementById(`eng_${selectedVocabEng.replace(/\s+/g, '_')}`).classList.add('matched');
      document.getElementById(`kor_${selectedVocabKor.replace(/\s+/g, '_')}`).classList.add('matched');
    }
    selectedVocabEng = null;
    selectedVocabKor = null;
    document.querySelectorAll('.match-btn').forEach(el => el.classList.remove('selected'));
  }
}

// Universal Quiz Option Click Handler
function handleOptionClick(type, itemIdx, selectedIdx, correctIdx) {
  const elementId = `opt_${type}_${itemIdx}_${selectedIdx}`;
  const targetEl = document.getElementById(elementId);

  if (selectedIdx === correctIdx) {
    localStorage.setItem(`${type}_${currentChapter}_${itemIdx}`, selectedIdx);
    renderContent();
  } else {
    if (targetEl) {
      targetEl.classList.add('incorrect-temp');
      setTimeout(() => {
        targetEl.classList.remove('incorrect-temp');
      }, 800);
    }
  }
}
